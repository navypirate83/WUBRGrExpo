<!--
  A Commander deck box drawn as plain lines (a "wireframe"): the tall
  flip-top "tower" box most Commander decks are kept in, seen from a
  corner, with its lid tipped open behind it. The planeswalker symbol
  (the same shape as the planeswalker cover symbol) is in the middle of
  the front, solid, since the planeswalker is the heart of a Commander
  deck. The lines are black; the app recolors them to suit the light or
  dark theme ("tintColor").
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" fill="none" stroke="#000000"
     stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
  <!-- The box: its front and its right side -->
  <rect x="12" y="18" width="26" height="27" rx="2.5"/>
  <path d="M38 18 L48 11 V38 L38 45"/>
  <!-- The opening on top -->
  <path d="M12 18 L22 11 H48"/>
  <!-- The lid, hinged at the back and tipped open -->
  <path d="M22 11 L28 2 H54 L48 11"/>
  <!-- The planeswalker symbol in the middle of the front. Its shape is
       about 54 wide by 100 tall, so it's shrunk to 21% and moved to the
       middle of the front. It's filled in solid, with a hairline edge so
       its thin points don't vanish when the picture is small. -->
  <path transform="translate(19.35 21.05) scale(0.21)" fill="#000000" stroke-width="3"
        d="M0 50.247l.156-1.969h-.061l.061-.032 2.059-26.239s1.026 18.147 4.085 23.392c1.313-.519 2.647-.984 4.002-1.403 3.306-8.657 4.467-34.379 4.467-34.379s.772 23.434 3.681 32.529c1.595-.239 3.218-.407 4.872-.51 3.007-11.188 3.824-41.636 3.824-41.636s.991 30.521 3.953 41.673c1.576.114 3.127.292 4.653.528 2.873-9.06 4.024-32.597 4.024-32.597s.931 25.864 3.941 34.449c1.319.409 2.617.871 3.89 1.376 3.338-5.179 4.513-23.388 4.513-23.388l1.592 26.224.067.034h-.063l.118 1.947s-26.689 8.691-26.689 49.485c0-40.601-27.146-49.485-27.146-49.485"/>
</svg>
