<!--
  A little mountain range drawn as plain lines: a tall peak with a
  smaller one beside it and a snow line across the top of the tall one.
  It stands for "Land" in the color-sorted card list. The lines are black;
  the app recolors them to suit the light or dark theme ("tintColor").
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" fill="none" stroke="#000000"
     stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <!-- The outline of the two peaks and the ground -->
  <path d="M3 28 L17 5 L27 21 L33 13 L45 28 Z"/>
  <!-- The snow line across the tall peak -->
  <path d="M12 13 L15 16 L17 13 L20 16"/>
</svg>
